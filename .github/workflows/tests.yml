name: Tests

# Runs the model's checks on the same Python / pandas / numpy as the daily run, whenever model code
# changes (and on demand). Nothing is committed: projections are for tomorrow, so nothing is logged.
# The last step (Summary) says what passed and how the run ended, in the log and on the run's page.
on:
  workflow_dispatch: {}
  push:
    paths: ["src/**", "research/**", "tests/**", ".github/workflows/**", ".github/scripts/**"]
concurrency:   # a newer push to the same branch replaces a test run still going
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # default is 6 h (a stuck download would hold a runner all day)
    env:
      TZ: America/New_York
      RUN_SUMMARY: /tmp/run_summary.txt   # each step adds what passed; the last step prints it (.github/scripts/summary.py)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install (same versions as the daily run)
        run: pip install "pandas==3.0.6" "numpy==2.5.3" pyflakes pyyaml && python -c "import sys, pandas, numpy; print('python', sys.version.split()[0], '| pandas', pandas.__version__, '| numpy', numpy.__version__)"
      - name: Restore MoneyPuck data (cached by the daily run)
        id: mp
        uses: actions/cache/restore@v6
        with:
          path: |
            data/moneypuck_games.csv
            data/moneypuck_games.csv.modified
          key: moneypuck-${{ github.run_id }}
          restore-keys: moneypuck-
      - name: Download MoneyPuck game data (not stored in the repo; skipped when the cached copy is current)
        run: python -c "import sys, os; sys.path.insert(0, 'src'); import model; assert model.refresh_data() or os.path.exists(model.DATA)"
      - name: Save MoneyPuck data (only when this run downloaded a new version)
        if: ${{ hashFiles('data/moneypuck_games.csv.modified') != '' && steps.mp.outputs.cache-matched-key != format('moneypuck-{0}', hashFiles('data/moneypuck_games.csv.modified')) }}
        continue-on-error: true   # a cache problem must not fail the tests
        uses: actions/cache/save@v6
        with:
          path: |
            data/moneypuck_games.csv
            data/moneypuck_games.csv.modified
          key: moneypuck-${{ hashFiles('data/moneypuck_games.csv.modified') }}
      - name: Static check
        id: static-check
        run: |
          python -m pyflakes src/*.py research/lib/*.py research/studies/*.py tests/*.py .github/scripts/*.py
          echo "✓ Static check (pyflakes): no problems" >> "$RUN_SUMMARY"
      - name: Workflow files and scripts parse (YAML + bash -n on every run block, so a typo never reaches the keeper)
        id: workflow-scripts
        run: |
          python - <<'PY'
          import glob, os, re, subprocess, yaml
          n, files = 0, sorted(glob.glob(".github/workflows/*.yml"))
          for path in files:
              for name, job in yaml.safe_load(open(path))["jobs"].items():
                  for step in job["steps"]:
                      if "run" in step:   # GitHub fills in its expressions before bash sees the script: stand-in X
                          r = subprocess.run(["bash", "-n"], input=re.sub(r"\$\{\{.*?\}\}", "X", step["run"]), text=True, capture_output=True)
                          assert r.returncode == 0, f"{path} {name} '{step.get('name')}': {r.stderr}"
                          n += 1
          print(f"all {len(files)} workflow files and {n} run blocks parse")
          open(os.environ["RUN_SUMMARY"], "a", encoding="utf-8").write(
              f"✓ Workflow files: all {len(files)} parse (YAML) and all {n} run blocks pass a bash syntax check\n")
          PY
      - name: Component checks
        id: component-checks
        run: |
          set -o pipefail
          python tests/check_model.py | tee /tmp/checks.txt || { grep -a '  FAIL' /tmp/checks.txt | sed 's/^ *FAIL */✗ Check failed: /' >> "$RUN_SUMMARY"; exit 1; }
          echo "✓ Component checks: $(tail -1 /tmp/checks.txt)" >> "$RUN_SUMMARY"
      - name: Projection run for tomorrow (never logged)
        id: projection-run
        run: |
          set -o pipefail   # without it a crash here would still pass (tail succeeds)
          python src/model.py today "$(date -d tomorrow +%F)" | tail -8
      - name: Dashboard build + settle on a copy
        id: dashboard-build
        run: python src/dashboard.py && python src/paper.py report && echo "✓ Dashboard builds" >> "$RUN_SUMMARY"
      - name: Backtest unchanged (and the dashboard's Backtest tab shows these numbers)
        id: backtest
        run: |
          python - <<'PY'
          import os, sys; sys.path[:0] = ["src", "research/lib"]
          import split_model as sm, history, dashboard
          p = sm.walk_split(sm.load_split(), known_starters=False)
          d = history.flagged(p).merge(history.lines()[lambda x: x.gameDate >= 20200801], on=["gameDate", "home", "away"])
          roi = lambda b: round(b.prof.mean() * 100, 1) if len(b) else None
          rows = []
          for s in sorted(d.season.unique()):
              o, c = history.bet_results(d[d.season == s], "open"), history.bet_results(d[d.season == s], "close")
              rows.append((f"{s}-{str(s + 1)[2:]}", len(o) or None, roi(o), len(c), roi(c)))
          o, c = history.bet_results(d, "open"), history.bet_results(d, "close")
          total = (len(o), roi(o), len(c), roi(c))
          print("per season (season, open bets, open ROI %, close bets, close ROI %):")
          for r in rows: print("  ", r)
          print("2021-26:", total)
          # bets within 1 and ROI within 0.15 pts (small MoneyPuck revisions); None = no opening lines that season
          near = lambda a, b: a == b or (None not in (a, b) and not isinstance(a, str) and abs(a - b) <= (1 if isinstance(a, int) else 0.15))
          same = lambda x, y: len(x) == len(y) and all(near(a, b) for a, b in zip(x, y))
          assert len(rows) == len(dashboard.BACKTEST) and all(same(r, b) for r, b in zip(rows, dashboard.BACKTEST)) \
              and same(total, dashboard.BACKTEST_TOTAL), \
              f"the dashboard's Backtest tab no longer matches the model: set dashboard.BACKTEST = {rows} and BACKTEST_TOTAL = {total}"
          open(os.environ["RUN_SUMMARY"], "a", encoding="utf-8").write(
              f"✓ Backtest unchanged: {total[0]} bets at the opening line ROI {total[1]:+.1f}%, {total[2]} at the close {total[3]:+.1f}% "
              f"(= the dashboard's Backtest tab, every season)\n")
          PY
      - name: Preview the AI game notes (only when Tests is started by hand; until 'Preview game notes' is on main)
        id: notes-preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python src/model.py today | tail -2   # today's games and their form, in this checkout only (nothing is committed)
          python src/notes.py --preview
      - name: Summary (what passed and how the run ended; also on the run's page)
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 .github/scripts/summary.py "Tests: checks the model code before it runs for real (static check, workflow scripts, component checks, a projection run for tomorrow, a dashboard build, backtest unchanged)" \
            || echo "Result: ${{ job.status }} (the summary script failed)"
