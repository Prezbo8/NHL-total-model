name: Tests

# Runs the model's checks on the same Python / pandas / numpy as the daily run, whenever model code
# changes (and on demand). Nothing is committed: projections are for tomorrow, so nothing is logged.
on:
  workflow_dispatch: {}
  push:
    paths: ["src/**", "research/**", "tests/**", ".github/workflows/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install (same versions as the daily run)
        run: pip install "pandas==3.0.6" "numpy==2.5.3" pyflakes && python -c "import sys, pandas, numpy; print('python', sys.version.split()[0], '| pandas', pandas.__version__, '| numpy', numpy.__version__)"
      - name: Download MoneyPuck game data (not stored in the repo)
        run: python -c "import sys; sys.path.insert(0, 'src'); import model; assert model.refresh_data()"
      - name: Static check
        run: python -m pyflakes src/*.py research/lib/*.py research/studies/*.py tests/*.py
      - name: Component checks (29)
        run: python tests/check_model.py
      - name: Projection run for tomorrow (never logged)
        run: python src/model.py today "$(date -d tomorrow +%F)" | tail -8
      - name: Dashboard build + settle on a copy
        run: python src/dashboard.py && python src/paper.py report
      - name: Backtest unchanged
        run: |
          python - <<'PY'
          import sys; sys.path[:0] = ["src", "research/lib"]
          import split_model as sm, history
          p = sm.walk_split(sm.load_split(), known_starters=False)
          d = history.flagged(p).merge(history.lines()[lambda x: x.gameDate >= 20200801], on=["gameDate", "home", "away"])
          for w, want in (("open", 1.3), ("close", 2.4)):
              b = history.bet_results(d, w); roi = b.prof.mean() * 100
              print(f"{w}: {len(b)} bets ROI {roi:+.1f}% (expected {want:+.1f}%)"); assert abs(roi - want) < 0.06
          PY
