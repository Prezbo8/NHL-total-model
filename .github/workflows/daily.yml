name: Daily NHL run

# 15:00 and 21:00 UTC = 11 AM and 5 PM Eastern (EDT); 10 AM / 4 PM after DST ends.
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York   # "today" means today in Eastern time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install pandas numpy

      - name: Settle yesterday's paper trades
        run: python paper.py settle

      - name: Project today's games, flag, log
        run: python model.py today

      - name: Report
        run: python paper.py report

      - name: Rebuild dashboard
        run: python dashboard.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to push"
          else
            git commit -m "daily update $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase
            git push
          fi

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (site may still update on its own)"
