name: Daily NHL run

# Every hour from 11 AM to 10 PM Eastern, all year (runs at :17), started by keeper.yml; this schedule is the backup.
# - GitHub schedules in UTC only, so summer (EDT) and winter (EST) sets are both listed; the "gate"
#   step runs whichever matches today's Eastern offset and skips the other.
# - Not on the hour: GitHub drops/delays scheduled runs at the top of the hour under load (none of the
#   :00 runs on Oct 2 2026 ever fired). Running twice is harmless (first logged line stays the bet,
#   settling skips settled games, the latest projection just refreshes).
on:
  schedule:
    - cron: "17 15-23,0-2 * * *"   # EDT 11:17a ... 10:17p
    - cron: "17 16-23,0-3 * * *"   # EST 11:17a ... 10:17p
  workflow_dispatch:
    inputs:
      trigger:
        description: "What started this run (hourly / pregame / manual)"
        default: manual

permissions:
  contents: write
  pages: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on Oct 19, 2026
    timeout-minutes: 45
    env:
      TZ: America/New_York   # "today" means today in Eastern time
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}   # run history (src/store.py); empty = skipped
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NHL_TRIGGER: ${{ inputs.trigger || github.event_name }}
    steps:
      - name: Gate (run only the schedule that matches Eastern time today)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date +%Z)" = "EDT" ]; then hours="15-23,0-2"; else hours="16-23,0-3"; fi
          if [ "${{ github.event.schedule }}" = "17 $hours * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "other daylight-saving slot: skipping"; fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install "pandas==3.0.6" "numpy==2.5.3"   # same versions tests/check_model.py passes on (Tests workflow)

      # each step runs even if an earlier one failed (e.g. settling hits an API outage),
      # so today's projections and the dashboard still get made; the run still shows red
      - name: Settle yesterday's paper trades
        if: steps.gate.outputs.run == 'true'
        run: python src/paper.py settle

      - name: Project today's games, flag, log
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: python src/model.py today

      - name: Report
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: python src/paper.py report

      - name: Rebuild dashboard
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: python src/dashboard.py

      - name: Commit and push results
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add data
          git add docs
          if git diff --cached --quiet; then
            echo "no changes to push"
          else
            git commit -m "daily update $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase
            git push
          fi

      - name: Rebuild GitHub Pages
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request failed (site may still update on its own)"
