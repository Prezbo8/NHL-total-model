name: Preview game notes

# Writes today's AI game notes (src/notes.py, Gemini's free tier) from any branch and prints them, with the HTML the
# dashboard would show, so a change to the notes can be looked at before it goes live. Started by hand only; nothing is
# committed (the checkout is thrown away). Uses free Gemini requests (about one per game).
# The last step (Summary) says what the run did and how it ended, in the log and on the run's page.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notes-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: America/New_York
      RUN_SUMMARY: /tmp/run_summary.txt   # each step adds what it did; the last step prints it (.github/scripts/summary.py)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install "pandas==3.0.6" "numpy==2.5.3"

      - name: Restore MoneyPuck data (saved by the once-a-day run)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/moneypuck_games.csv
            data/moneypuck_games.csv.modified
          key: moneypuck-${{ github.run_id }}
          restore-keys: moneypuck-

      - name: Project today's games (and save their form for the notes, in this checkout only)
        id: project-games
        run: |
          set -o pipefail
          python src/model.py today | tail -2

      - name: Write and print the notes (with the dashboard HTML)
        id: write-notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/notes.py --preview

      - name: Summary (what this run did and how it ended; also on the run's page)
        if: ${{ always() }}
        env:
          STARTED_BY: manual
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 .github/scripts/summary.py "Preview game notes: writes today's AI game notes from this branch and prints them with the dashboard HTML (nothing is committed)" \
            || echo "Result: ${{ job.status }} (the summary script failed)"
