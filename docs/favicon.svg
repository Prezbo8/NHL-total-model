<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -9 100 106">
<!-- Site logo: crossed hockey sticks, O/U plate, puck at the blades. Also the browser-tab icon. -->
<defs>
 <linearGradient id="nl-silver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7280"/><stop offset=".35" stop-color="#e5e7eb"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#9ca3af"/></linearGradient>
 <linearGradient id="nl-gray" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#374151"/><stop offset=".4" stop-color="#a3acb9"/><stop offset=".55" stop-color="#cbd5e1"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
 <linearGradient id="nl-blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#374151"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>
 <linearGradient id="nl-puck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4556"/><stop offset="1" stop-color="#1c232e"/></linearGradient>
 <!-- one stick drawn upright (butt at y=0, heel at y=86); the blade is bent at the lie angle -->
 <g id="nl-rest">
  <path d="M-1 12 L-1.2 82" stroke="#fff" stroke-opacity=".45" stroke-width=".8"/>
  <path d="M-2.6 14 H2.6 L2.68 21 H-2.68Z" fill="#c8102e"/>
  <path d="M-2.7 23 H2.7 L2.72 24.6 H-2.72Z" fill="#c8102e"/>
  <rect x="-3.4" y="-1.5" width="6.8" height="11" rx="2" fill="#111827" stroke="#0b1220" stroke-width=".6"/>
  <path d="M-3.4 2 L3.4 0.4 M-3.4 5 L3.4 3.4 M-3.4 8 L3.4 6.4" stroke="#4b5563" stroke-width=".7"/>
  <g transform="translate(0 86) rotate(34)">
   <path d="M-3.6 -5 Q-5.2 2.4 0 3.4 L26 3.4 Q31.6 3.2 31.8 -0.9 Q31.6 -4.8 26 -4.9 L9 -4.3 Q3 -4.1 1 -7 Z" fill="url(#nl-blade)" stroke="#0b1220" stroke-width=".8"/>
   <path d="M7 -4 L26 -4.5 Q30.8 -4.2 30.9 -0.9 Q30.8 2.4 26 2.5 L7 2.5Z" fill="#f1f5f9"/>
   <path d="M11 -4.1 L9.6 2.5 M15 -4.2 L13.6 2.5 M19 -4.3 L17.6 2.5 M23 -4.4 L21.6 2.5 M27 -4.4 L25.6 2.5" stroke="#94a3b8" stroke-width=".45" stroke-opacity=".7"/>
  </g>
 </g>
</defs>
<g transform="translate(0 -7)">
 <g transform="translate(14 2) rotate(-34)">
  <path d="M-2.5 0 H2.5 L3 86 H-3Z" fill="url(#nl-silver)" stroke="#0b1220" stroke-width=".8"/><use xlink:href="#nl-rest" href="#nl-rest"/>
 </g>
 <g transform="translate(100 0) scale(-1 1) translate(14 2) rotate(-34)">
  <path d="M-2.5 0 H2.5 L3 86 H-3Z" fill="url(#nl-gray)" stroke="#0b1220" stroke-width=".8"/><use xlink:href="#nl-rest" href="#nl-rest"/>
 </g>
 <rect x="22" y="30" width="56" height="30" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
 <text x="50" y="54" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="900" font-size="24" fill="#64748b"><tspan fill="#22c55e">O</tspan>/U</text>
</g>
<ellipse cx="50" cy="92" rx="11" ry="3.6" fill="#0b0f15"/><rect x="39" y="86.5" width="22" height="5.5" fill="#0b0f15"/>
<ellipse cx="50" cy="86.5" rx="11" ry="3.6" fill="url(#nl-puck)" stroke="#64748b" stroke-width="1"/>
</svg>
